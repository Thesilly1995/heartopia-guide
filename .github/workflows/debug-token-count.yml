name: Debug token count

# Tijdelijk diagnose-workflow om te checken of pushmeldings-tokens correct
# in Supabase belanden. Handmatig te draaien via de Actions-tab. Wordt na
# gebruik weer verwijderd — geen onderdeel van de reguliere meldingen-flow.
on:
  workflow_dispatch: {}

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - name: Tokens per categorie tellen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node -e '
          const categories = ["rainbow_meteor", "event", "codes", "cloud_backup_reminder"];
          (async () => {
            const totalRes = await fetch(`${process.env.SUPABASE_URL}/rest/v1/push_tokens?select=token,platform,categories,updated_at`, {
              headers: { apikey: process.env.SUPABASE_SERVICE_ROLE_KEY, Authorization: `Bearer ${process.env.SUPABASE_SERVICE_ROLE_KEY}` },
            });
            const rows = await totalRes.json();
            console.log(`Totaal aantal geregistreerde tokens: ${rows.length}`);
            for (const row of rows) {
              console.log(`- platform=${row.platform} categories=${JSON.stringify(row.categories)} updated_at=${row.updated_at}`);
            }
            for (const cat of categories) {
              const res = await fetch(`${process.env.SUPABASE_URL}/rest/v1/push_tokens?select=token&categories=cs.{${cat}}`, {
                headers: { apikey: process.env.SUPABASE_SERVICE_ROLE_KEY, Authorization: `Bearer ${process.env.SUPABASE_SERVICE_ROLE_KEY}` },
              });
              const catRows = await res.json();
              console.log(`${cat}: ${catRows.length} toestel(len)`);
            }
          })();
          '

      - name: Test-insert met de publieke anon-key (zelfde pad als de app)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          node -e '
          const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRodHRkYmJueHluYXF5Y2psbHRkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxOTkyNDksImV4cCI6MjEwMTc3NTI0OX0.8pHh-8lOXt7J4_SSg5DE6L_Fcrp3ptZCyBlyoCcAYiE";
          (async () => {
            const testToken = "debug-test-token-" + Date.now();
            const res = await fetch(`${process.env.SUPABASE_URL}/rest/v1/push_tokens`, {
              method: "POST",
              headers: {
                apikey: ANON_KEY,
                Authorization: `Bearer ${ANON_KEY}`,
                "Content-Type": "application/json",
                Prefer: "resolution=merge-duplicates,return=representation",
              },
              body: JSON.stringify({ token: testToken, platform: "debug", categories: ["codes"], updated_at: new Date().toISOString() }),
            });
            const body = await res.text();
            console.log(`Insert-status: ${res.status}`);
            console.log(`Insert-body: ${body}`);
            if (res.ok) {
              const del = await fetch(`${process.env.SUPABASE_URL}/rest/v1/push_tokens?token=eq.${testToken}`, {
                method: "DELETE",
                headers: { apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}` },
              });
              console.log(`Cleanup delete-status: ${del.status}`);
            }
          })();
          '
